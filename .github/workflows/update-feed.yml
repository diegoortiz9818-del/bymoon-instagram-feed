name: Actualizar feed de Instagram

on:
  schedule:
    # Corre todos los días a las 09:00 UTC (≈ 4:00 am Colombia)
    - cron: "0 9 * * *"
  workflow_dispatch: {} # permite correrlo manualmente desde el botón "Run workflow"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consultar Instagram y generar feed.json
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node fetch-instagram.js

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --quiet --cached || git commit -m "Actualiza feed de Instagram"
          git push
